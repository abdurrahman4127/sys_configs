# General Settings
save-position-on-quit=yes               # Resume video where you left off
keep-open=yes                           # Don't close the player after video ends

# Playback Resume (watch-later)
# By default mpv keys resume state on the media path, so the same video opened
# via a symlink (/home/ar/torrents/...) or after a folder rename starts at 0:00.
# Filename-only keys make every route to a video share the same saved position.
# State lives in ~/.local/state/mpv/watch_later/ and entries untouched for
# 14 days are pruned by mpv-wl-prune.timer (see sys_configs/mpv/README.md).
ignore-path-in-watch-later-config=yes
write-filename-in-watch-later-config=yes # Write "# <filename>" into each entry
script-opts=autosave-position-interval=10 # Save position every 10s (scripts/autosave-position.lua)

# Video Profile & Quality
profile=high-quality                    # Built-in high quality preset
# vo=gpu-next                             # Best video output driver
# gpu-api=vulkan                          # Modern API (fallback to opengl if stuttering)

# Hardware Video Decoding (Fixes high CPU usage)
hwdec=auto-safe                         # Automatically choose safest hardware acceleration

# Audio and Subtitles
alang=eng,en                            # Priority audio languages
slang=eng,en,en-us,enus,en-sdh,sdh      # Target standard English, US English, and SDH variants
sub-auto=fuzzy                          # Autoload external subtitles containing the video title + 'eng' or 'sdh'
sub-forced-events-only=no               # Ensure regular and SDH lines show up, not just forced signs/translations

# Screenshots
screenshot-format=png
screenshot-directory="~/Pictures/mpv"
